<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 신청 | 김이훈 법률사무소</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://worldip.kr/#consult">
<!-- 아임웹 시절의 상담 신청 주소(worldip.kr/info)로 들어오시는 분을 위한 안내입니다.
     명함·안내물에 적힌 주소가 끊기지 않도록 남겨 둡니다. -->
<meta http-equiv="refresh" content="3; url=/#consult">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --navy:#1a2b5c; --navy-deep:#0f1b3d; --gold:#b8973f; --gold-light:#d9c48a;
    --ivory:#f6f3ec; --ink:#1e2433; --ink-soft:#5b6478; --line:#e3e6ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);background:var(--ivory);line-height:1.7;word-break:keep-all;letter-spacing:-0.01em;
    min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  .wrap{width:min(680px,100% - 40px);margin:0 auto}
  header{background:#fff;border-bottom:1px solid var(--line);padding:18px 0}
  header .wrap{display:flex;align-items:center;gap:12px}
  .mark{width:34px;height:34px;border:2px solid var(--navy);display:grid;place-items:center;
    font-size:13px;color:var(--gold);font-weight:800;border-radius:2px;flex-shrink:0}
  .brand{font-weight:700;font-size:18px;color:var(--navy);line-height:1.25;letter-spacing:-.02em}
  .brand small{display:block;font-size:10px;letter-spacing:.18em;color:var(--ink-soft);font-weight:500}
  main{flex:1;display:grid;place-items:center;padding:72px 0}
  .box{text-align:center}
  .code{font-size:13px;letter-spacing:.22em;color:var(--gold);font-weight:600;margin-bottom:16px}
  h1{font-size:clamp(24px,4vw,32px);color:var(--navy);line-height:1.35;letter-spacing:-.02em}
  p.lead{color:var(--ink-soft);margin-top:16px;font-size:16px}
  .links{margin-top:34px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-block;padding:13px 24px;border-radius:6px;font-weight:600;font-size:15px}
  .btn-main{background:var(--navy);color:#fff}
  .btn-sub{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn:hover{opacity:.9}
  .note{margin-top:18px;font-size:13.5px;color:var(--ink-soft)}
  .help{margin-top:36px;padding-top:26px;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink-soft)}
  .help b{color:var(--navy)}
  .help a{color:var(--gold);font-weight:600}
  footer{background:var(--navy-deep);color:rgba(255,255,255,.7);font-size:13px;padding:26px 0;text-align:center}
  @media (max-width:520px){ .links{flex-direction:column} .btn{width:100%} }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="mark" href="/">IP</a>
    <a class="brand" href="/">김이훈 법률사무소<small>KIM YI HOON LAW OFFICE</small></a>
  </div>
</header>

<main>
  <div class="wrap box">
    <div class="code">CONSULTATION</div>
    <h1>상담 신청 페이지가 옮겨졌습니다</h1>
    <p class="lead">홈페이지를 새로 단장하면서 상담 신청이 홈 화면 안으로 들어왔습니다.<br>잠시 뒤 자동으로 이동합니다.</p>

    <div class="links">
      <a class="btn btn-main" href="/#consult">상담 신청하러 가기</a>
      <a class="btn btn-sub" href="tel:18111945">전화 1811-1945</a>
    </div>

    <p class="note">자동으로 넘어가지 않으면 위 버튼을 눌러 주세요.</p>

    <p class="help">
      전화 <b>1811-1945</b> (평일 09:00~18:00) ·
      <a href="mailto:info@worldip.co.kr">info@worldip.co.kr</a>
    </p>
  </div>
</main>

<footer>
  김이훈 법률사무소 · 서울 송파구 법원로8길 7, 화엄타워 301호 · 1811-1945
</footer>

</body>
</html>
